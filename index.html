<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyankshetra - BPSC TRE 3.0 Biology Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .quiz-container {
            width: 100%;
            max-width: 480px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .brand-title {
            color: #f1e05a;
            font-size: 24px;
            font-weight: bold;
        }

        .quiz-sub-info {
            font-size: 13px;
            color: #8b949e;
            margin-top: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #21262d;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
        }

        .stat-green { color: #3fb950; }
        .stat-red { color: #f85149; }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #d97706;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #b45309;
        }

        .question-box {
            display: none;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #f1e05a;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #30363d;
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #f1e05a;
            transition: width 0.3s;
        }

        .q-text {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #f0f6fc;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .option-btn:hover {
            background-color: #30363d;
        }

        .option-btn.selected {
            border-color: #f1e05a;
            background-color: #2d333b;
        }

        .badge {
            background-color: #30363d;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 12px;
        }

        .next-btn-container {
            margin-top: 20px;
        }

        .score-card {
            display: none;
            text-align: center;
        }

        .final-score {
            font-size: 36px;
            color: #f1e05a;
            margin: 15px 0;
            font-weight: bold;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .stat-card {
            background-color: #21262d;
            padding: 15px;
            border-radius: 6px;
            font-size: 13px;
        }

        .telegram-preview {
            background-color: #0d1117;
            border: 1px dashed #30363d;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            text-align: left;
            margin-bottom: 15px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <div class="brand-title">Gyankshetra</div>
        <div class="quiz-sub-info">अभ्यास क्विज़ - BPSC TRE 3.0 | Biology: उत्तक (31-60)</div>
        <div class="stats-bar">
            <span class="stat-green">✔ सही: +1.0</span>
            <span class="stat-red">✖ गलत: -0.33</span>
            <span>📋 कुल प्रश्न: 30</span>
        </div>
    </div>

    <!-- Registration Screen -->
    <div id="reg-screen">
        <h3 style="text-align: center; margin-bottom: 15px;">अभ्यर्थी पंजीकरण (Registration)</h3>
        <div class="input-group">
            <label for="username">आपका नाम (Candidate Name):</label>
            <input type="text" id="username" placeholder="यहाँ अपना नाम लिखें...">
        </div>
        <button class="btn" onclick="startQuiz()">► Start Quiz (क्विज़ शुरू करें)</button>
    </div>

    <!-- Question Screen -->
    <div id="quiz-screen" class="question-box">
        <div class="q-header">
            <span id="q-count">प्रश्न 1/30</span>
            <span id="timer">⏱ 30:00</span>
        </div>
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="q-text" class="q-text"></div>
        <div id="options-container" class="options-list"></div>
        <div class="next-btn-container">
            <button class="btn" onclick="nextQuestion()">आगे बढ़ें ➔</button>
        </div>
    </div>

    <!-- Scorecard Screen -->
    <div id="score-screen" class="score-card">
        <h3>क्विज़ परिणाम / Scorecard</h3>
        <p style="margin-top: 5px; color: #8b949e;">Candidate: <span id="res-name" style="color:#fff;"></span></p>
        
        <div class="final-score" id="res-score">0.00</div>
        
        <div class="grid-stats">
            <div class="stat-card">कुल प्रश्न<br><b id="res-total" style="font-size: 18px;">30</b></div>
            <div class="stat-card" style="color:#3fb950;">✔ सही उत्तर<br><b id="res-correct" style="font-size: 18px;">0</b></div>
            <div class="stat-card" style="color:#f85149;">✖ गलत उत्तर<br><b id="res-wrong" style="font-size: 18px;">0</b></div>
            <div class="stat-card" style="color:#8b949e;">➖ छोड़े गए<br><b id="res-skipped" style="font-size: 18px;">0</b></div>
        </div>

        <div class="telegram-preview" id="tg-preview"></div>

        <button class="btn" style="background-color: #0088cc; margin-bottom: 10px;" onclick="shareTelegram()">✈ Telegram पर स्कोर भेजें</button>
        <button class="btn" style="background-color: #30363d;" onclick="location.reload()">⟳ पुनः प्रयास करें</button>
    </div>
</div>

<script>
    const questions = [
        { q: "31. पौधों में लंबाई में वृद्धि के लिए कौन-सा ऊतक जिम्मेदार होता है?", options: ["पार्श्व विभज्योतक (Lateral Meristem)", "शीर्षस्थ विभज्योतक (Apical Meristem)", "अंतरविष्ट विभज्योतक (Intercalary Meristem)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "32. तने और जड़ों की परिधि (मोटाई) में वृद्धि किस ऊतक के कारण होती है?", options: ["पार्श्व विभज्योतक (Lateral Meristem)", "शीर्षस्थ विभज्योतक (Apical Meristem)", "मृदुतक (Parenchyma)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "33. पौधों में प्रकाश संश्लेषण, भोजन का भंडारण और स्राव करने वाला प्राथमिक ऊतक कौन-सा है?", options: ["दृढ़ोतक (Sclerenchyma)", "स्थूलकोण ऊतक (Collenchyma)", "मृदुतक (Parenchyma)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 2 },
        { q: "34. नारियल का छिलका/रेशा किस ऊतक का बना होता है?", options: ["मृदुतक (Parenchyma)", "दृढ़ोतक (Sclerenchyma)", "स्थूलकोण ऊतक (Collenchyma)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "35. पौधों को लचीलापन प्रदान करने वाला सरल स्थायी ऊतक कौन-सा है?", options: ["स्थूलकोण ऊतक (Collenchyma)", "दृढ़ोतक (Sclerenchyma)", "जाइलम (Xylem)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "36. जलीय पौधों में वायु गुहिकाएँ किस ऊतक में पाई जाती हैं जो उन्हें तैरने में मदद करती हैं?", options: ["एरेनकाइमा (Aerenchyma)", "क्लोरेनकाइमा (Chlorenchyma)", "स्क्लेरेनकाइमा (Sclerenchyma)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "37. निम्नलिखित में से कौन-सा जटिल स्थायी ऊतक (Complex Permanent Tissue) है?", options: ["जाइलम (Xylem)", "फ्लोएम (Phloem)", "मृदुतक (Parenchyma)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "38. जाइलम का मुख्य कार्य क्या है?", options: ["पत्तियों से भोजन का संवहन करना", "जड़ से जल और खनिज लवणों का संवहन करना", "पौधों को केवल यांत्रिक सहारा देना", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "39. जाइलम के कौन-से घटक मृत (Non-living) होते हैं?", options: ["वाहिनिका (Tracheids)", "वाहिका (Vessels)", "जाइलम फाइबर (Xylem Fibres)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "40. जाइलम का कौन-सा एकमात्र घटक जीवित (Living) कोशिका से बना होता है?", options: ["जाइलम मृदुतक (Xylem Parenchyma)", "जाइलम फाइबर", "वाहिका (Vessels)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "41. पौधों में तैयार भोजन का संवहन पत्तियों से अन्य भागों तक कौन करता है?", options: ["जाइलम", "फ्लोएम", "कैम्बियम", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "42. फ्लोएम का कौन-सा तत्व अकोशिकीय/मृत कोशिकाओं से बना होता है?", options: ["चालनी नलिका (Sieve Tubes)", "साथी कोशिकाएँ (Companion Cells)", "फ्लोएम रेशे (Phloem Fibres)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 2 },
        { q: "43. मानव शरीर में त्वचा की बाहरी परत किस प्रकार के ऊतक की बनी होती है?", options: ["शल्की उपकला ऊतक (Squamous Epithelium)", "घनाकार उपकला ऊतक", "स्तंभाकार उपकला ऊतक", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "44. फेफड़ों की कूपिका (Alveoli) में पदार्थों के विसरण के लिए कौन-सा ऊतक पाया जाता है?", options: ["घनाकार उपकला", "सरल शल्की उपकला (Simple Squamous)", "संयोजी ऊतक", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "45. वृक्क नलिका (Kidney Tubules) को यांत्रिक सहारा देने वाला ऊतक है:", options: ["घनाकार उपकला ऊतक (Cuboidal)", "स्तंभाकार उपकला ऊतक", "तंत्रिका ऊतक", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "46. आहारनाल में अवशोषण और स्राव का कार्य करने वाली लंबी कोशिकाएँ किस ऊतक का हिस्सा हैं?", options: ["शल्की उपकला", "स्तंभाकार उपकला (Columnar Epithelium)", "पक्ष्माभी उपकला", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "47. श्वसन नली में श्लेष्मा (Mucus) को आगे धकेलने में कौन-सा उपकला ऊतक सहायक होता है?", options: ["पक्ष्माभी स्तंभाकार उपकला (Ciliated)", "शल्की उपकला", "घनाकार उपकला", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "48. निम्नलिखित में से कौन-सा एक तरल संयोजी ऊतक (Fluid Connective Tissue) है?", options: ["रक्त (Blood)", "लसिका (Lymph)", "अस्थि (Bone)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "49. दो अस्थियों (Bone to Bone) को आपस में जोड़ने वाले संयोजी ऊतक को क्या कहते हैं?", options: ["कंडरा (Tendon)", "स्नायु (Ligament)", "उपास्थि (Cartilage)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "50. मांसपेशियों को अस्थि (Muscle to Bone) से जोड़ने वाले ऊतक को क्या कहा जाता है?", options: ["स्नायु (Ligament)", "कंडरा (Tendon)", "एरिओलर (Areolar)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "51. नाक, कान और कंठ में पाया जाने वाला चिकना संयोजी ऊतक कौन-सा है?", options: ["उपास्थि (Cartilage)", "अस्थि (Bone)", "वसामय ऊतक", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "52. हमारे शरीर में वसा (Fat) का संचय करने वाला ऊतक कौन-सा है?", options: ["एरिओलर ऊतक", "वसामय ऊतक (Adipose Tissue)", "स्नायु", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "53. त्वचा और मांसपेशियों के बीच कौन-सा संयोजी ऊतक पाया जाता है?", options: ["एरिओलर ऊतक (Areolar Tissue)", "वसामय ऊतक", "उपास्थि", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 0 },
        { q: "54. ऐच्छिक पेशी (Voluntary Muscle) किसे कहा जाता है?", options: ["कंकाल पेशी", "रेखित पेशी", "अरेखित पेशी", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "55. कार्डिएक पेशी (Cardiac Muscle) की विशेषता क्या है?", options: ["यह केवल हृदय में पाई जाती है", "यह अनैच्छिक होती है", "यह जीवन भर बिना थके लयबद्ध संकुचित होती है", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "56. अरेखित/चिकनी पेशी (Smooth Muscle) कहाँ पाई जाती है?", options: ["आहारनाल में", "आंख की आइरिस में", "फेफड़ों की श्वसनी में", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "57. तंत्रिका ऊतक (Nervous Tissue) की कार्यात्मक इकाई क्या है?", options: ["नेफ्रॉन", "न्यूरॉन (Neuron)", "साइटॉन", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 },
        { q: "58. न्यूरॉन के मुख्य भाग कौन-कौन से हैं?", options: ["कोशिकाकाय (Cyton)", "दुमिका (Dendrite)", "तंत्रिकाक्ष (Axon)", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "59. पौधों में द्वितीयक वृद्धि (Secondary Growth) के लिए कौन-सा ऊतक जिम्मेदार होता है?", options: ["एधा (Cambium)", "पार्श्व विभज्योतक", "एपिडर्मिस", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 3 },
        { q: "60. छाल की कोशिकाओं की भित्ति पर किस रसायन का जमाव होता है?", options: ["लिग्निन", "सुबेरिन (Suberin)", "क्युटिन", "उपर्युक्त में से एक से अधिक", "उपर्युक्त में से कोई नहीं"], ans: 1 }
    ];

    let currentQ = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let username = "";
    let timeLeft = 1800; // 30 mins
    let timerInterval;

    function startQuiz() {
        const nameInput = document.getElementById("username").value.trim();
        if(!nameInput) {
            alert("कृपया अपना नाम दर्ज करें!");
            return;
        }
        username = nameInput;
        document.getElementById("reg-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById("timer").innerText = `⏱ ${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }, 1000);
    }

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById("q-count").innerText = `प्रश्न ${currentQ + 1}/${questions.length}`;
        document.getElementById("progress-fill").style.width = `${((currentQ + 1)/questions.length)*100}%`;
        document.getElementById("q-text").innerText = q.q;

        const optsContainer = document.getElementById("options-container");
        optsContainer.innerHTML = "";

        const labels = ["A", "B", "C", "D", "E"];
        q.options.forEach((opt, idx) => {
            const btn = document.createElement("div");
            btn.className = `option-btn ${userAnswers[currentQ] === idx ? 'selected' : ''}`;
            btn.innerHTML = `<span>${opt}</span><span class="badge">${labels[idx]}</span>`;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(idx) {
        userAnswers[currentQ] = idx;
        loadQuestion();
    }

    function nextQuestion() {
        if(currentQ < questions.length - 1) {
            currentQ++;
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("score-screen").style.display = "block";

        let correct = 0, wrong = 0, skipped = 0;

        userAnswers.forEach((ans, idx) => {
            if(ans === null) {
                skipped++;
            } else if(ans === questions[idx].ans) {
                correct++;
            } else {
                wrong++;
            }
        });

        let totalScore = (correct * 1.0) - (wrong * 0.33);

        document.getElementById("res-name").innerText = username;
        document.getElementById("res-score").innerText = totalScore.toFixed(2);
        document.getElementById("res-correct").innerText = correct;
        document.getElementById("res-wrong").innerText = wrong;
        document.getElementById("res-skipped").innerText = skipped;

        const tgText = `👤 छात्र का नाम: ${username}\n📚 विषय: Biology - उत्तक (31-60)\n📝 कुल प्रश्न: 30\n✅ सही उत्तर: ${correct}\n❌ गलत उत्तर: ${wrong}\n➖ छोड़े गए: ${skipped}\n🎯 अंतिम अंक: ${totalScore.toFixed(2)}`;
        
        document.getElementById("tg-preview").innerText = tgText;
    }

    function shareTelegram() {
        const text = encodeURIComponent(document.getElementById("tg-preview").innerText);
        window.open(`https://t.me/share/url?url=&text=${text}`, '_blank');
    }
</script>
